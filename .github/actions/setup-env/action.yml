name: "Setup Node and pnpm"
description: "Checkout, setup node and pnpm with cache"
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.5.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
